<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IDEARIA Lab | Cards Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f1;color:#203c39;font:16px system-ui}header{background:#173f3b;color:white;padding:28px}header a{color:white}main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}section{background:white;padding:20px;border-radius:16px}label{display:block;margin-top:12px}input,select,textarea,button{font:inherit;width:100%;padding:10px;border:1px solid #bbcfc9;border-radius:8px}input[type=checkbox]{width:auto}button{background:#28665e;color:white;cursor:pointer;margin-top:10px}#card{text-align:center;padding:32px 20px;border-radius:20px;min-height:420px}#avatar{width:90px;height:90px;object-fit:cover;border-radius:50%}.links{display:grid;gap:10px}.links div{padding:12px;border:1px solid currentColor;border-radius:12px}footer{text-align:center;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:720px){main{grid-template-columns:1fr}}@keyframes shift{50%{background-position:100% 50%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><header><a href="https://idearialab.pages.dev/">IDEARIA Lab</a><p>Sembramos ideas. Impulsamos negocios.</p><h1>Cards Studio</h1><p>Laboratorio de tarjetas virtuales</p><small>Demostración pública: no ingresar datos reales de clientes.</small></header><main><section><h2>Diseñar tarjeta</h2><label>Negocio<input id="name" value="Estudio Aurora"></label><label>Actividad<input id="job" value="Belleza y bienestar"></label><label>Estilo<select id="style"></select></label><label>Fondo<input type="color" id="bg" value="#191713"></label><label>Texto<input type="color" id="fg" value="#e8ca87"></label><label>Distribución<select id="layout"><option>Vertical</option><option>Mosaico</option><option>Compacta</option></select></label><label>Animación<select id="effect"><option>Estático</option><option>Degradado</option></select></label><label>Fotografía o logo<input type="file" id="photo" accept="image/png,image/jpeg,image/webp"></label><label>Descripción<textarea id="desc">Tu espacio de bienestar.</textarea></label><h3>Funciones</h3><div id="features"></div></section><section><h2>Vista previa</h2><div id="card"><img id="avatar" hidden><h2 id="title"></h2><p id="activity"></p><p id="description"></p><div class="links" id="links"></div><p><small>Diseñado por IDEARIA Lab</small></p></div></section><section><h2>Cotización</h2><label>Paquete<select id="plan"><option>Básica</option><option>Intermedia</option><option>Premium</option></select></label><label>Renta<select id="term"><option>Mensual</option><option>Semestral</option><option>Anual</option></select></label><label>Anticipo<input id="advance" type="number" min="0" value="0"></label><pre id="quote"></pre><button id="copy">Copiar cotización</button></section><section><h2>Orden al laboratorio</h2><pre id="order"></pre><button id="export">Exportar pedido JSON</button></section></main><footer><a href="https://idearialab.pages.dev/">Volver a IDEARIA Lab</a></footer><script>
const $=id=>document.getElementById(id),styles=[['Élite','#191713','#e8ca87'],['Profesional','#e2eff9','#194c76'],['Natural','#e2ebd9','#355d40'],['Belleza','#f4dce6','#864660'],['Artesanal','#f1dfc9','#9b5135'],['Gourmet','#301b1a','#ffca89'],['Tecnológica','#10283e','#7de5e8'],['Infantil','#fff0c9','#6b4599'],['Creativa','#e8e0f6','#56399a'],['Tropical','#d6f2e9','#146e71'],['Industrial','#323a40','#f6cf48'],['Minimalista','#f6f5f0','#343434']],plans=[[400,80,450,800],[600,120,650,1200],[1000,170,950,1700]],funcs=[['WhatsApp',0,0],['Teléfono',0,0],['Instagram',0,0],['Facebook',0,0],['Ubicación',0,0],['Guardar contacto VCF',0,0],['Agenda',1,150],['Opiniones',1,80],['Servicios',1,100],['Galería',2,150],['Música',2,100],['Video',2,150]];let data={},photo='';styles.forEach(s=>$('style').add(new Option(s[0])));funcs.forEach((f,i)=>{let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=i<6;c.dataset.i=i;l.append(c,' '+f[0]);$('features').append(l)});function render(){let p=$('plan').selectedIndex,t=$('term').selectedIndex,bg=$('bg').value,fg=$('fg').value,selected=[...document.querySelectorAll('[data-i]:checked')].map(c=>funcs[+c.dataset.i]),extra=selected.reduce((a,f)=>a+(f[1]>p?f[2]:0),0)+($('effect').selectedIndex&&p===0?80:0),rent=plans[p][t+1],total=plans[p][0]+extra+rent,advance=Math.max(0,Number($('advance').value)||0);$('title').textContent=$('name').value;$('activity').textContent=$('job').value;$('description').textContent=$('desc').value;$('card').style.color=fg;$('card').style.background=$('effect').selectedIndex?'linear-gradient(120deg,'+bg+','+fg+','+bg+')':bg;$('card').style.backgroundSize='300% 300%';$('card').style.animation=$('effect').selectedIndex?'shift 8s infinite':'';$('links').style.gridTemplateColumns='repeat('+($('layout').selectedIndex+1)+',1fr)';$('links').replaceChildren();selected.forEach(f=>{let d=document.createElement('div');d.textContent=f[0];$('links').append(d)});$('quote').textContent=['Fabricación: $'+plans[p][0],'Complementos: $'+extra,'Publicación inicial incluida','Renta: $'+rent,'Total: $'+total+' MXN','Anticipo: $'+advance,'Saldo: $'+Math.max(0,total-advance),'Venta directa: Ángel $'+(total*.4).toFixed(2)+' / Desarrollo $'+(total*.4).toFixed(2)+' / IDEARIA $'+(total*.2).toFixed(2)].join('\n');data={negocio:$('name').value,actividad:$('job').value,descripcion:$('desc').value,estilo:$('style').value,bg,fg,distribucion:$('layout').value,animacion:$('effect').value,funciones:selected.map(f=>f[0]),paquete:$('plan').value,periodo:$('term').value,total,advance,estado:'Pendiente de aprobación'};$('order').textContent=JSON.stringify(data,null,2)}document.addEventListener('input',render);$('style').onchange=()=>{let s=styles[$('style').selectedIndex];$('bg').value=s[1];$('fg').value=s[2];render()};$('photo').onchange=()=>{let f=$('photo').files[0];if(!f||f.size>5000000)return;let r=new FileReader();r.onload=()=>{photo=r.result;$('avatar').src=photo;$('avatar').hidden=false};r.readAsDataURL(f)};$('copy').onclick=()=>navigator.clipboard.writeText($('quote').textContent);$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...data,imagen:photo},null,2)],{type:'application/json'}));a.download='idearia-pedido.json';a.click()};render();</script></html>
